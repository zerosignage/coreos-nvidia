# Force-load NVIDIA kernel modules at boot via systemd-modules-load.service.
#
# Without this, the modules load lazily on first nvidia-smi / CUDA call,
# which races with zsig-nvidia-cdi.service's ConditionPathExists=/dev/nvidia0
# check during boot — service fires before /dev/nvidia0 exists, gets skipped,
# CDI spec never gets generated until manual intervention.
#
# Loading at boot guarantees /dev/nvidia*, /dev/nvidia-uvm, /dev/nvidia-modeset
# exist by the time After=systemd-modules-load.service-ordered services run.

nvidia
nvidia_modeset
nvidia_drm
nvidia_uvm
